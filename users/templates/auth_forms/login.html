{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PESU Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --bg:#070a10;--surface:#0e1420;--border:#1c2535;--border-2:#263040;
            --text:#e2e8f4;--text-2:#7d8fa8;--text-3:#4a5568;
            --accent:#3ee5b0;--red:#f87171;
            --mono:'Consolas','Courier New',monospace;
            --sans:'Inter',Arial,sans-serif;
        }
        html{height:100%;}
        body{
            font-family:var(--sans);
            background:var(--bg);color:var(--text);
            min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            padding:32px 16px;
            -webkit-font-smoothing:antialiased;
            position:relative;overflow:hidden;
        }
        body::before{
            content:'';position:fixed;top:-200px;right:-200px;
            width:700px;height:700px;
            background:radial-gradient(circle,rgba(62,229,176,0.07) 0%,transparent 65%);
            pointer-events:none;filter:blur(40px);
        }
        body::after{
            content:'';position:fixed;bottom:-300px;left:80px;
            width:600px;height:600px;
            background:radial-gradient(circle,rgba(96,110,255,0.05) 0%,transparent 65%);
            pointer-events:none;filter:blur(50px);
        }

        .auth-wrap{
            position:relative;z-index:2;
            width:100%;max-width:420px;
        }

        /* Brand at top */
        .auth-brand{
            display:flex;align-items:center;gap:10px;
            justify-content:center;
            margin-bottom:32px;
        }
        .auth-brand-icon{
            width:40px;height:40px;border-radius:10px;
            background:linear-gradient(135deg,rgba(62,229,176,0.25),rgba(62,229,176,0.06));
            border:1px solid rgba(62,229,176,0.25);
            display:flex;align-items:center;justify-content:center;
            font-family:var(--mono);font-size:19px;font-weight:800;
            color:var(--accent);text-shadow:0 0 16px rgba(62,229,176,0.5);
        }
        .auth-brand-text{line-height:1.2;}
        .auth-brand-name{font-size:16px;font-weight:700;color:#fff;}
        .auth-brand-sub{font-size:10px;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;}

        .auth-card{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:18px;
            padding:36px 32px;
            box-shadow:0 0 0 1px rgba(62,229,176,0.04),0 24px 64px rgba(0,0,0,0.5);
            position:relative;overflow:hidden;
        }
        .auth-card::before{
            content:'';position:absolute;top:0;left:0;right:0;height:1px;
            background:linear-gradient(90deg,transparent,rgba(62,229,176,0.25),transparent);
        }

        .auth-heading{
            font-size:22px;font-weight:800;color:#fff;
            letter-spacing:-0.02em;margin-bottom:4px;
        }
        .auth-sub{
            font-size:13px;color:var(--text-2);margin-bottom:28px;
        }

        form p{margin-bottom:18px;}
        form p label{
            display:block;
            font-size:11.5px;font-weight:600;color:var(--text-2);
            text-transform:uppercase;letter-spacing:0.09em;
            margin-bottom:8px;
        }
        form p input{
            width:100%;padding:11px 14px;
            background:#090e18;
            border:1px solid var(--border);
            border-radius:9px;
            color:var(--text);font-size:14px;
            font-family:var(--sans);
            transition:border-color 0.18s,box-shadow 0.18s;
            outline:none;
        }
        form p input:focus{
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(62,229,176,0.12);
        }
        form p input::placeholder{color:var(--text-3);}

        .helptext{display:block;font-size:11px;color:var(--text-3);margin-top:5px;}
        .errorlist{
            list-style:none;padding:0;margin:6px 0 0;
            color:var(--red);font-size:12px;
        }

        /* Submit */
        .auth-btn{
            display:flex;align-items:center;justify-content:center;
            width:100%;padding:12px 20px;
            margin-top:8px;
            border:none;border-radius:999px;
            background:var(--accent);color:#04120d;
            font-size:14px;font-weight:700;
            font-family:var(--sans);
            cursor:pointer;
            transition:transform 0.15s,box-shadow 0.2s;
        }
        .auth-btn:hover{
            transform:translateY(-1px);
            box-shadow:0 0 24px rgba(62,229,176,0.38);
        }

        /* Divider */
        .auth-divider{
            display:flex;align-items:center;gap:12px;
            margin:22px 0;
        }
        .auth-divider span{flex:1;height:1px;background:var(--border);}
        .auth-divider p{font-size:11px;color:var(--text-3);white-space:nowrap;}

        /* Link */
        .auth-link-row{
            text-align:center;font-size:13px;color:var(--text-2);
            margin-top:20px;
        }
        .auth-link-row a{color:var(--accent);font-weight:600;text-decoration:none;transition:opacity 0.15s;}
        .auth-link-row a:hover{opacity:0.8;}
        ::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:var(--bg);}
        ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px;}
    </style>
</head>
<body>
    <div class="auth-wrap">

        <div class="auth-brand">
            <div class="auth-brand-icon">P</div>
            <div class="auth-brand-text">
                <div class="auth-brand-name">PESU Nexus</div>
                <div class="auth-brand-sub">Student Portal</div>
            </div>
        </div>

        <div class="auth-card">
            <div class="auth-heading">Welcome back</div>
            <div class="auth-sub">Sign in to your account to continue</div>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="auth-btn" type="submit">Sign In</button>
            </form>

            <div class="auth-divider">
                <span></span><p>New here?</p><span></span>
            </div>

            <div class="auth-link-row">
                Don't have an account?
                <a href="{% url 'users:register' %}">Create one →</a>
            </div>
        </div>

    </div>
</body>
</html>
